name: Deploy React (CRACO) to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Prepare GitHub Pages files
        run: |
          touch build/.nojekyll
          echo "bullmate.cz" > build/CNAME

      - name: Publish to gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin gh-pages
          publish_dir="$RUNNER_TEMP/bejk-pages"
          git worktree add --detach "$publish_dir" FETCH_HEAD
          rsync -a --delete --exclude='.git' build/ "$publish_dir/"
          git -C "$publish_dir" add -A
          if git -C "$publish_dir" diff --cached --quiet; then
            echo "Site is already up to date."
            exit 0
          fi
          git -C "$publish_dir" commit -m "Deploy ${GITHUB_SHA}"
          git -C "$publish_dir" push origin HEAD:gh-pages
